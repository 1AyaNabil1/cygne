name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Postgres and the dashboard start, and the dashboard stays locked without a password
        run: |
          docker compose up -d db dashboard
          for i in $(seq 1 40); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health || { docker compose logs; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/)" = 503
