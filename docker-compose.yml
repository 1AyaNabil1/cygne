services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cygne
      POSTGRES_PASSWORD: cygne
      POSTGRES_DB: cygne
    volumes:
      - cygne_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygne"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: python -m cygne.channels.telegram
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cygne:cygne@db:5432/cygne
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: .
    command: uvicorn cygne.dashboard.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://cygne:cygne@db:5432/cygne
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cygne_pgdata:
